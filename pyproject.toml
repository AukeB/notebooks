[project]
name = "notebooks"
version = "0.1.0"
description = "Repository used for stand-alone notebooks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.23.3",
    "openai-whisper>=20250625",
    "pillow>=13.0.0",
    "pytesseract>=0.3.13",
    "pytube>=15.0.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "docstring-tailor>=0.4.1",
    "mypy>=1.19.0",
    "pyright>=1.1.414",
    "ruff>=0.14.8",
    "ty>=0.0.29",
]

[tool.docstring_tailor]
line-length = 80
style = "google"
